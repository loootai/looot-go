# Runs when a v* tag is pushed. Go has no package upload: the module proxy serves any tag of a
# public repo, and pkg.go.dev lists it once the proxy has fetched it. This workflow tests the
# tag, asks the proxy for it (which also makes pkg.go.dev index it) and creates the GitHub
# release. No registry secret is needed.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.4.0
        with:
          go-version-file: go.mod
      - name: Version constant matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          grep -q "const Version = \"$want\"" client.go || { echo "client.go Version is not $want"; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Ask the Go module proxy for the tag
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS "https://proxy.golang.org/github.com/loootai/looot-go/@v/${GITHUB_REF_NAME}.info" && exit 0
            sleep 20
          done
          exit 1
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." --verify-tag
